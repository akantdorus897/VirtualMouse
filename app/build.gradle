plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.majazi.vmouse'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('vmouse.keystore')
            storePassword 'vmouse123'
            keyAlias 'vmouse'
            keyPassword 'vmouse123'
        }
    }

    defaultConfig {
        applicationId "com.majazi.vmouse"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "3.6"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
